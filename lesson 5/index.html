<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 5</title>
</head>
<body>
    <form action="">

        <fieldset>
            <legend>personal information 2.0</legend>
        <label for="firstname">First Name:</label>
        <input type="text" required><br>
        <label for="lastname">Last Name:</label>
        <input type="text" placeholder="heu">
        <br>
        <label for="email">Email:</label>
        <input type="email" disabled size="199">
        <br>
        <label for="password">Password:</label>
        <input type="password" readonly value="929">
        <br>
        <label for="">Gender:</label>
        <input type="radio" name="male"  id="male"  value="male">
        <label for="male">Male</label>
        <input type="radio" name="female"  id="female"  value="female">
        <label for="female">Female</label>
        <br>
        <label for="hobbies">hobbies</label>
        <br>
        <label for="gaming">gaming</label>
        <input type="checkbox" name="gaming"  id="gaming"  value="gaming">
        <br>
        <label for="swimming">swimming</label>
        <input type="checkbox" name="swimming"  id="swimming"  value="swimming">
        <br>
        <label for="foootball">foootball</label>
        <input type="checkbox" name="foootball"  id="foootball"  value="foootball">
        <br>
        <select name="pet" id="pet">
            <option value="dog">dog</option>
            <option value="none">none</option>
            <option value="cat">cat</option>
        </select>
        <br>

        <textarea name="message" id="message" maxlength="000111"></textarea>
        





        <br>
        <input type="submit">
        </fieldset>
    </form>
    
</body>
</html>
